<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
    <!-- 优化的垃圾桶图标（24x24 视窗，与起飞/RTL 等工具条图标一致）。
         均匀线宽 + 圆角的线稿风格：盖子略宽于桶身，顶部中央一段提手，
         桶身三条等距竖纹。ColoredSvgImageProvider 按 alpha 遮罩着色，
         呈现单色剪影，线宽与间距的一致性决定观感。 -->
    <g fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <!-- 桶身：圆角矩形，上沿在盖子下方 -->
        <path d="M4.8 7.2h14.4l-1.05 12.1a1.9 1.9 0 0 1-1.89 1.72H7.74a1.9 1.9 0 0 1-1.89-1.72L4.8 7.2z"/>
        <!-- 盖子：略宽于桶身 -->
        <path d="M3.4 4.6h17.2"/>
        <!-- 提手 -->
        <path d="M10 4.6V3.1h4v1.5"/>
        <!-- 桶身竖纹 -->
        <path d="M9.2 9.6v9.2"/>
        <path d="M12 9.6v9.2"/>
        <path d="M14.8 9.6v9.2"/>
    </g>
</svg>